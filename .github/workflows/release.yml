name: Create component release

on:
  push:
    tags:
      - "desktop-v*"
      - "web-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            web/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r web/backend/requirements.txt
      - run: npm ci
        working-directory: web/frontend
      - name: Validate release tag
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            desktop-v*) expected="$(python scripts/check_versions.py --component desktop)" ;;
            web-v*) expected="$(python scripts/check_versions.py --component web)" ;;
            *) echo "Unsupported release tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          test "$GITHUB_REF_NAME" = "$expected" || { echo "Tag must be $expected, got $GITHUB_REF_NAME" >&2; exit 1; }
      - run: make preflight
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            See the component-specific notes in [CHANGELOG.md](https://github.com/Chrisser73/ps2-save-tool/blob/main/CHANGELOG.md).
